
#####-----基础配置-----#####
# 敌方颜色：red | blue
enemy_color: "red"

#####-----神经网络参数-----#####
# 推理后端选择（必须指定）：tensorrt | openvino
# tensorrt: 使用TensorRT推理（需要NVIDIA GPU和TensorRT）
# openvino: 使用OpenVINO推理（支持CPU/Intel GPU）
inference_backend: tensorrt   # 切换这里: tensorrt | openvino

# 选择装甲板识别后端：yolov8 | yolo11 | yolov5 | yolo26
yolo_name: yolo26

# 数字/字迹分类器模型路径
classify_model: assets/tiny_resnet.onnx
classify_engine_path: assets/tiny_resnet.engine

#####-----OpenVINO模型路径-----#####
# YOLO模型路径（根据yolo_name选择对应模型）
# yolo11_model_path: assets/yolo11.xml      # 输入640×640
yolov8_model_path: assets/yolov8.xml        # 输入416×416
yolov5_model_path: assets/yolov5.xml        # 输入640×640
# yolo26_model_path: assets/test_yolo26_int8_openvino_model/test_yolo26.xml       # 输入640×640

# OpenVINO推理设备：CPU | GPU | AUTO
# CPU: 使用CPU推理（兼容性最好）
# GPU: 使用GPU推理（需要Intel核显驱动）
# AUTO: 自动选择最优设备
device: GPU

use_cuda_preprocess: true

#####-----TensorRT模型路径-----#####
# TensorRT引擎文件路径（优先使用，加载速度快）
yolo11_engine_path: assets/engines/yolo11.engine    # YOLO11引擎
yolov8_engine_path: assets/engines/yolov8.engine    # YOLOV8引擎
yolo26_engine_path: assets/engines/test_yolo26.engine    # YOLO26引擎

# TensorRT ONNX模型路径（如果engine不存在，会从ONNX构建并保存）
yolo11_onnx_path: assets/yolo11.onnx                # YOLO11 ONNX
yolov8_onnx_path: assets/yolov8.onnx                # YOLOV8 ONNX
yolo26_onnx_path: assets/engines/test_yolo26.onnx                # YOLO26 ONNX

# yolo26 TRT 后处理阈值（低光/运动模糊场景建议降低score阈值）
yolo26_score_threshold: 0.20
yolo26_nms_threshold: 0.30
yolo26_trt_swap_rb: false
yolo26_use_nms: false

# TensorRT精度模式（构建引擎时使用，暂未实现）
tensorrt_fp16_mode: true    # 是否使用FP16精度（提升速度）
tensorrt_int8_mode: false   # 是否使用INT8量化（进一步提速）

#####-----推理参数-----#####
# 是否启用异步推理（YOLO11支持）
# 异步推理可以实现GPU推理与CPU后处理并行，提升整体帧率
# 注意：异步推理会有1帧延迟
use_async_inference: false

# 分类器最小置信度（0.0-1.0）
min_confidence: 0.6

# 是否启用传统角点微调（仅yolov5使用）
use_traditional: true

#####-----功能开关-----#####
# 是否启用打符模块
enable_buff: false

#####-----ROI（感兴趣区域）参数-----#####
roi:
  x: 420          # ROI左上角X坐标
  y: 50           # ROI左上角Y坐标
  width: 1150      # ROI宽度
  height: 1150     # ROI高度

# 是否启用ROI裁剪（首次联调建议false）
use_roi: true

#####-----传统检测方法参数-----#####
# 注意：仅在use_traditional=true时使用
threshold: 150                         # 二值化阈值（0-255）150
max_angle_error: 45                    # 灯条最大倾角误差（度）
min_lightbar_ratio: 1.5                # 灯条高宽比下限
max_lightbar_ratio: 20                 # 灯条高宽比上限
min_lightbar_length: 8                 # 灯条最小长度（像素）
min_armor_ratio: 1                     # 装甲板宽高比下限
max_armor_ratio: 5                     # 装甲板宽高比上限
max_side_ratio: 1.5                    # 两侧灯条长度比上限
max_rectangular_error: 25              # 矩形偏差上限（度）

#####-----Tracker（跟踪器）参数-----#####
# 连续检测到目标的最小帧数，达到后进入tracking状态
min_detect_count: 10

# 临时丢失目标的最大容忍帧数
max_temp_lost_count: 15

# 前哨站的临时丢失容忍帧数（通常设置更大）
outpost_max_temp_lost_count: 100

#####-----Aimer（瞄准器）参数-----#####
# 瞄准角度偏置（用于快速校准）
yaw_offset: 0       # 偏航角偏置（度）
pitch_offset: -1.7    # 俯仰角偏置（度）

# 小陀螺目标瞄准参数
comming_angle: 70     # 装甲板出现角度（度）
leaving_angle: 20     # 装甲板离开角度（度）

# 执行延迟补偿（毫秒）
# 用于补偿命令从发送到实际执行的延迟
actuation_delay_ms: 0
min_spin_speed: 2 # rad/s
decision_speed: 12 # rad/s
high_speed_delay_time: 0.05 # s 0.045   0.073
low_speed_delay_time: 0.05 # s  0.045
#####-----Shooter（开火控制）参数-----#####
# 射击容差（度）
first_tolerance: 1.2      # 近距离射击容差
second_tolerance: 0.7     # 远距离射击容差  1
mode: 1
# 距离判断阈值（米）
judge_distance: 4

# 是否由自瞄控制射击
auto_fire: true

#####-----相机配置-----#####
camera_name: "daheng"

# 相机基础参数
exposure_ms: 2.1        # 曝光时间（毫秒）
gain: 18                # 增益  24

# 相机VID:PID（用于识别特定相机）
vid_pid: "2ba2:4d55"    # 大恒相机的VID:PID

# 是否启用调试模式
debug: true

# 相机详细设置
camera_settings:
  width: 1920                    # 图像宽度
  height: 1200                   # 图像高度
  exposure: 4000                 # 曝光时间（微秒）
  auto_exposure: false           # 是否自动曝光
  gain: 24                   # 增益值
  fps: 168                       # 目标帧率
  auto_white_balance: true       # 是否自动白平衡
  rgain: 0.0                     # R通道增益（手动白平衡时使用）
  bgain: 0.0                     # B通道增益
  ggain: 0.0                     # G通道增益
  time_offset: 45500000          # 时间戳偏移
  auto_exp_change: true         # 是否允许自动曝光变化
  max_exp: 3000                  # 最大曝光时间
  min_exp: 200                   # 最小曝光时间
  pixel_format: BayerRG8         # 像素格式


#####-----相机标定参数-----#####
# 老云台
#camera_matrix: [1575.972347, 0.000000, 943.701703, 0.000000, 1576.696750, 593.061205, 0.000000, 0.000000, 1.000000]
#distort_coeffs: [-0.253254, 0.193990, 0.000312, -0.000487, 0.000000]
distort_coeffs: [-0.375227, 0.697012, 0.001761, 0.000622, 0.000000]
camera_matrix: [2829.900069, 0.000000, 991.485939, 0.000000 ,2831.416719, 581.264713, 0.000000, 0.000000, 1.000000]
# 相机同理想情况的偏角: yaw0.02 pitch1.94 roll1.40 degree
# 标定板到世界坐标系原点的水平距离: 4.12 m
# 标定板同竖直摆放时的偏角: yaw-87.29 pitch7.65 roll-0.51 degree

R_camera2gimbal: [0,0,1,
 -1,0,0,
  0,-1,0]

#t_camera2gimbal: [-0.034955523715399906, -0.000074403211899371, 0.001248173910106823]
t_camera2gimbal: [-0.221481869, 0.003857163, -0.037747091 ]
R_gimbal2imubody:   [1, 0, 0,
  0, 1, 0,
  0, 0, 1]    


# #####-----CAN协议配置-----#####
# new_can_quat_id: 0x150        # 四元数姿态帧ID
# new_can_cmd_id: 0x170         # 自瞄指令帧ID
# can_interface: "can0"
# debug_rx: false
# debug_tx: true
####-----gimbal参数（仅“直连云台测试程序”使用；当前仅连接 C 板可忽略）-----#####
com_port: "/dev/ttyACM0"
baudrate: 115200  #328125
gimbal_protocol: "scm"  # 可选: scm | sp_crc16
scm_sof: 85               # SOF 字节（0x55 = 85）
scm_eof: 255              # EOF 字节（0xFF = 255）
scm_rx_id: 1              # 云台->上位机 帧ID (MCU->Host)
scm_tx_id: 2              # 上位机->云台 帧ID (Host->MCU)
scm_angles_in_deg: false  # 角度单位是否使用度（true: 度，false: 弧度）
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0


#####-----轨迹规划器（Planner）参数-----#####
# 开火阈值（rad）
fire_thresh: 0.0035
# 纵向： 90mm 横向65mm
#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]